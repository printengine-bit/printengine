services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: printengine
      POSTGRES_USER: printengine
      POSTGRES_PASSWORD: printengine-local-only
    ports:
      - "5432:5432"
    volumes:
      - printengine-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printengine -d printengine"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  printengine-postgres:
